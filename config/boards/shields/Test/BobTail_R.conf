
CONFIG_ZMK_KEYBOARD_NAME="BobTail"
# レイヤー通知は基本 Consumer page の未割り当てコード（0x01D0–0x01D5）で送る。
# Scroll だけ例外で F22（Keyboard page）。どちらも macOS が keyDown を組み立てない
# ので、BobTailBar のタップが止まっていても文字として漏れない。詳しい理由は
# config/BobTail.keymap の IND_* 定義そばのコメントを参照
# （Help は使わない。Finder がカーソル下の項目を選択してしまうため）
# ここに CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y は要らない。
# あれは ZMK_HID_REPORT_TYPE_NKRO 依存で、NKRO を選んでいない今は
# 代入しても無効のまま警告が出るだけ。既定の HKRO レポートは使用 ID を
# そのまま載せるので F22 はこのままホストへ届く
# （NKRO 拡張レポートは ZMK 側の注記どおり Android で入力が途切れる）
CONFIG_ZMK_MOUSE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_BT_DEVICE_NAME_MAX=30


CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=28
# Keep the chosen axis longer so a brief pause mid-scroll does not unlock and
# then fire a stray HWHEEL tick (Spark / Finder alert beep).
CONFIG_PMW3610_SCROLL_LOCK_IDLE_MS=350
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=1200
CONFIG_PMW3610_BALL_ACTION_SETTLE_MS=80

# フリックしてボールが止まったあと、少しだけ惰性でスクロールを続ける。
# macOS のトラックパッドに寄せるための設定。ボールに触れた瞬間に止まる。
# 効きすぎる / 足りないときは DECAY_PERMILLE（大きいほど早く止まる）と
# MIN_INTERVAL_MS（小さいほど初速が速い）で調整する
CONFIG_PMW3610_SCROLL_MOMENTUM=y
CONFIG_PMW3610_SCROLL_MOMENTUM_SETTLE_MS=70
CONFIG_PMW3610_SCROLL_MOMENTUM_MIN_INTERVAL_MS=16
CONFIG_PMW3610_SCROLL_MOMENTUM_MAX_INTERVAL_MS=140
CONFIG_PMW3610_SCROLL_MOMENTUM_DECAY_PERMILLE=1150
CONFIG_PMW3610_SCROLL_MOMENTUM_MIN_TICKS=2
CONFIG_PMW3610_SCROLL_MOMENTUM_MAX_TICKS=60

CONFIG_PMW3610_MOVEMENT_THRESHOLD=2

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


CONFIG_ZMK_BATTERY_REPORTING=y
# 左手側(ペリフェラル)の残量も取得し、2つ目の Battery Service として
# ホストへ公開する。これで左右それぞれの残量が % で読めるようになる。
# ※ macOS の Bluetooth メニューは 1 つ目(右手側)しか表示しないため、
#   左右まとめて見るには tools/macos の常駐アプリを使う
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
#CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y


CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n 
