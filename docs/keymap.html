<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BobTailESC キーマップ</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #181b22;
      --panel-edge: rgba(255, 255, 255, 0.07);
      --key: #242933;
      --key-top: #2c323e;
      --key-edge: #3d4554;
      --ink: #f0ebe3;
      --muted: #8b929f;
      --hold: #d4a574;
      --layer: #7eb0ff;
      --mod: #8fcdb0;
      --ime: #e4a0b6;
      --num: #e0c08a;
      --trans: #22262f;
      --press: #c9a06a;
      --gap: 6px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; padding: 32px 24px 64px; }
    header { max-width: 980px; margin: 0 auto 28px; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    .lede { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 0; }
    .toolbar { max-width: 980px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    button.tab, button.os {
      appearance: none; border: 1px solid var(--key-edge); background: var(--panel);
      color: var(--ink); padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    button.tab[aria-selected="true"], button.os[aria-pressed="true"] {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    .board-wrap {
      max-width: 980px; margin: 0 auto; background: var(--panel);
      border: 1px solid var(--panel-edge); border-radius: 22px; padding: 18px 14px 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .board {
      position: relative; width: 100%; max-width: 920px; aspect-ratio: 1024 / 594;
      margin: 0 auto; container-type: inline-size;
    }
    .hw, .keys { position: absolute; inset: 0; }
    .keys { z-index: 1; }
    .case {
      position: absolute;
      border-radius: 28px;
      background: linear-gradient(160deg, #1f2430 0%, #151920 100%);
      border: 1px solid #3a4250;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 -10px 18px rgba(0, 0, 0, 0.22),
        0 14px 28px rgba(0, 0, 0, 0.32);
    }
    .case-l { left: 4.4%; top: 16.16%; width: 42.97%; height: 60.44%; }
    .case-r { left: 53.22%; top: 16.16%; width: 42.09%; height: 60.27%; }
    .enc {
      position: absolute; z-index: 1;
      left: 39.10%; top: 40.36%; width: 5.97%; height: 9.85%;
      border-radius: 9px; border: 1px solid #4a5364;
      background: #14171d;
      display: flex; padding: 3px;
      box-shadow: 0 2px 0 #0a0c10;
    }
    .enc-slot {
      flex: 1; min-height: 0;
      border: 1px solid #323846; border-radius: 6px;
      background: #10131a;
      padding: 3px 4px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.55);
    }
    .enc-wheel {
      position: relative;
      height: 100%;
      border-radius: 4px;
      overflow: hidden;
      background: linear-gradient(90deg, #1a1d24 0%, #5c6570 22%, #c8cdd4 48%, #5c6570 74%, #14171c 100%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.28);
    }
    .enc-wheel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.0) 0 2px,
        rgba(0,0,0,0.42) 2px 3px
      );
    }
    .enc-wheel::after {
      content: "";
      position: absolute;
      top: 8%; bottom: 8%;
      left: 42%;
      width: 16%;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      filter: blur(1px);
    }
    .tb {
      position: absolute; z-index: 1;
      left: 66.4%; top: 56.4%; width: 24.2%; height: 18.6%;
      display: flex; align-items: center; gap: 2.4%;
    }
    .tb-hatch {
      border: 1px solid #3a4250;
      background: repeating-linear-gradient(-45deg, #2a313a 0 3px, #16191f 3px 6px);
    }
    .tb-hatch-l { width: 18%; height: 58%; border-radius: 4px; }
    .tb-ring {
      position: relative; width: 46%; aspect-ratio: 1; height: auto; align-self: center;
      border-radius: 50%; background: #12151b; border: 2px solid #3a4250;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.55);
    }
    .tb-sphere {
      position: absolute; inset: 10%; border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, #8a909a 0 7%, #3a404a 36%, #14161b 72%);
      box-shadow: inset -6px -8px 12px rgba(0,0,0,0.45), 0 4px 8px rgba(0,0,0,0.35);
    }
    .tb-sphere::after {
      content: ""; position: absolute; left: 22%; top: 16%; width: 28%; height: 18%;
      border-radius: 50%; background: rgba(255,255,255,0.22); filter: blur(1px);
    }
    .tb-frame {
      width: 28%; height: 62%; border-radius: 8px; padding: 8% 10%;
      background: #1a1e26; border: 1.5px solid #3a4250;
    }
    .tb-hatch-r { width: 100%; height: 100%; border-radius: 4px; }
    .key {
      position: absolute;
      border-radius: 8px; border: 1px solid var(--key-edge);
      background: #14181f; color: var(--ink);
      display: flex; padding: 2.5px; user-select: none;
      box-shadow: 0 2px 0 #090b0e;
      transition: border-color 100ms ease, box-shadow 100ms ease, transform 100ms ease;
    }
    .key .face {
      flex: 1; min-height: 0; min-width: 0;
      border: 1px solid #303745; border-radius: 5px;
      background: linear-gradient(180deg, var(--key-top) 0%, var(--key) 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 3px 4px 2px;
      overflow: hidden;
    }
    .key.trans { background: var(--trans); color: #6c7280; box-shadow: none; }
    .key.trans .face { background: var(--trans); border-style: dashed; border-color: #454b57; }
    .key.none .face { background: transparent; border-style: dashed; border-color: #3a4050; }
    .key.kind-mod .hold { color: var(--mod); }
    .key.kind-layer .hold { color: var(--layer); }
    .key.kind-ime .tap { color: var(--ime); }
    .key.kind-num .tap { color: var(--num); }
    .key.pressed {
      border-color: var(--press);
      transform: translateY(1px);
      box-shadow: 0 0 0 1.5px rgba(201, 160, 106, 0.85), 0 1px 0 #0c0e12;
    }
    .key.pressed .face {
      background: linear-gradient(180deg, #4a3d2c 0%, #3a3124 100%);
      border-color: var(--press);
    }
    .hold {
      font-size: clamp(7px, 1.05cqi, 10px);
      line-height: 1.05;
      color: var(--hold);
      min-height: 0.95em;
      font-weight: 560;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tap {
      font-size: clamp(9px, 1.45cqi, 13px);
      font-weight: 650;
      line-height: 1.12;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tap.long { font-size: clamp(7px, 1.1cqi, 10px); letter-spacing: -0.03em; font-weight: 600; }
    .note { max-width: 980px; margin: 18px auto 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .hud-meta { display: none; }
    .layer-chip {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(240, 235, 227, 0.94);
      color: #12141a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    /* —— HUD / embed: fill the overlay without clipping —— */
    html.hud, html.hud body,
    html.embed, html.embed body {
      background: transparent;
      min-height: 0 !important;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    html.hud body, html.embed body,
    body.embed, body.hud {
      min-height: 0;
      padding: 0;
      margin: 0;
    }
    html.hud header, html.embed header,
    html.hud .note, html.embed .note,
    body.embed header, body.hud header,
    body.embed .note, body.hud .note { display: none; }
    html.hud .toolbar, body.hud .toolbar { display: none; }

    html.hud .shell, body.hud .shell,
    html.embed .shell, body.embed .shell {
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
      box-sizing: border-box;
    }
    html.hud .board-wrap, body.hud .board-wrap,
    html.embed .board-wrap, body.embed .board-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border-radius: 18px;
      display: grid;
      place-items: center;
      overflow: hidden;
      container-type: size;
    }
    body.hud .board-wrap {
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,0.04), transparent 55%),
        rgba(18, 21, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }
    body.embed .board-wrap {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      box-shadow: none;
      padding: 8px;
    }
    html.hud .board, body.hud .board,
    html.embed .board, body.embed .board {
      /* Fit aspect-ratio inside the overlay box without cropping */
      width: min(100%, calc(100cqh * 1024 / 594));
      height: auto;
      max-height: 100%;
      max-width: 100%;
      aspect-ratio: 1024 / 594;
      margin: 0;
    }
    html.hud .hud-meta, body.hud .hud-meta {
      display: block;
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 6;
      margin: 0;
      pointer-events: none;
    }
    html.embed .hud-meta, body.embed .hud-meta { display: none; }
    body.hud .key, body.embed .key,
    body.hud .enc, body.embed .enc { padding: 2px; border-radius: 7px; }
    body.hud .key .face, body.embed .key .face { padding: 2px 3px 1px; border-radius: 4px; }
    body.hud .case, body.embed .case { border-radius: 24px; }
  </style>
  <script>
    (function () {
      const mode = (location.hash || "").replace("#", "");
      if (mode === "hud" || mode === "embed") {
        document.documentElement.classList.add(mode);
      }
    })();
  </script>
</head>

  <div class="toolbar">

    <div style="display:flex;gap:6px">

  </div>
  <div class="shell">

      <div class="hud-meta"><span class="layer-chip" id="layer-chip">Base</span></div>

          <div class="case case-l"></div>

          </div>
        </div>
        <div class="keys" id="keys"></div>
      </div>
    </div>
  </div>
  <p class="note" id="note"></p>
  <p class="note">
    <span class="legend">
      <span><i class="sw" style="background:#d4a574"></i>長押し</span>

  base: "英字・Enter・? は単機能。左下は専用 Shift / Ctrl / Command。英数は長押し L⌥、かなは長押し Sym。Space は打鍵後125ms以上間を置いて220ms保持すると Num。Fn は右下の専用キーです。",
  num: "左手テンキー。上から 1 2 3 / 4 5 6 / 7 8 9。0 は Z、修飾キーはそのまま使えます。右手は逆T字の矢印、U/O は PgUp/PgDn、M は Insert。括弧は {} がホーム、() がその下、[] が親指。",
  fn: "右下の専用 Fn を押します。F1–F9 は数字と同じ位置。F10/F11/F12 は +/−/= の列。BT0/BT1 は Q/A、BT2 は Z。Caps Word は ⌫ の位置です。",
  sym: "かなを押しながら別キーを押すと即 Sym。Enter と ? に長押し機能はありません。上2段は記号、下段は Caps / RAlt / ScrollLock / Pause、Home / End / PgUp / PgDn。RAlt は AltGr を必要とする配列の予備です。",
  gesture: "A が Tab、S が Shift+Tab、Q が Esc、C が Caps Word、⌫ が Delete、. / / が文頭 / 文末。Gesture+Space を押して両方離すと Num固定（再度で解除）。ボールのフリックは従来どおりです。",
  mouse: "ボール操作でAMLを10秒維持。H/J/K/L/; は戻る/左/中/右/進む、それ以外を押すと解除。中クリック長押しでスクロール。BobTailBarの設定で慣性・速度・応答を調整できます。",
  scroll: "中クリック長押し中。ボールがスクロールになります。専用の Scroll キーはありません。",
};

const LAYERS = [
  { id: "base", name: "Base" },
  { id: "num", name: "Num+Nav" },
  { id: "fn", name: "Fn (=数字の位置)" },
  { id: "sym", name: "Sym" },
  { id: "gesture", name: "Gesture" },
  { id: "mouse", name: "Mouse" },
];

let current = "base";
let os = "mac";
let pressed = [];

function applyAppearance(mode) {
  const resolved = (mode === "embed" || mode === "hud") ? mode : "page";
  document.documentElement.classList.remove("page", "embed", "hud");
  document.body.classList.remove("page", "embed", "hud");
  document.documentElement.classList.add(resolved);
  document.body.classList.add(resolved);
}

applyAppearance((location.hash || "").replace("#", ""));

function layerLabel(id) {
  if (id === "scroll") return "Scroll";
  const found = LAYERS.find((item) => item.id === id);
  return found ? found.name : id;
}

function keysFor(id) {
  const live = liveKeys(id);
  if (live) return live;
  const win = os === "win";
  if (id === "base") return win ? BASE_WIN : BASE_MAC;
  if (id === "num") return win ? NUM_WIN : NUM_MAC;
  if (id === "sym") return SYM;
  if (id === "gesture") return win ? GEST_WIN : GEST_MAC;
  if (id === "fn") return FN;
  if (id === "mouse") return MOUSE;
  if (id === "scroll") return MOUSE.map((key, index) => [17, 18, 20, 21].includes(index) ? NO : key);
}

function render() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const layer of LAYERS) {
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = layer.name;
    b.setAttribute("aria-selected", layer.id === current ? "true" : "false");
    b.addEventListener("click", () => { current = layer.id; render(); });
    tabs.appendChild(b);
  }

  const keysEl = document.getElementById("keys");
  keysEl.innerHTML = "";
  const pad = { x: 0.28, y: 0.4, w: 0.55, h: 0.85 };
  const place = (el, box) => {
    el.style.left = (box.x - pad.x) + "%";
    el.style.top = (box.y - pad.y) + "%";
    el.style.width = (box.w + pad.w) + "%";
    el.style.height = (box.h + pad.h) + "%";
  };
  const esc = KEY_BOXES[27];
  const space = KEY_BOXES[39];
  const encEl = document.querySelector(".enc");
  if (encEl) encEl.title = `時計回り: ${os === "win" ? "Ctrl" : "⌘"}+=  /  反時計回り: ${os === "win" ? "Ctrl" : "⌘"}+- (全レイヤー)`;
  if (encEl && esc && space) {
    const gap = space.y - (esc.y + esc.h);
    place(encEl, { x: esc.x, y: esc.y - gap - esc.h, w: esc.w, h: esc.h });
  }
  keysFor(current).forEach((key, i) => {
    const box = KEY_BOXES[i];
    if (!box || i === ENC) return;
    const div = document.createElement("div");
    div.className = "key";
    if (key.trans) div.classList.add("trans");
    if (key.none) div.classList.add("none");
    if (key.kind) div.classList.add("kind-" + key.kind);
    if (pressed.includes(i)) div.classList.add("pressed");
    div.dataset.i = String(i);
    place(div, box);
    const tap = key.tap || "";
    const tapClass = tap.length >= 4 ? "tap long" : "tap";
    const title = [key.hold, tap].filter(Boolean).join(" / ");
    if (title) div.title = title;
    const face = document.createElement("div");
    face.className = "face";
    const holdEl = document.createElement("div");
    holdEl.className = "hold";
    holdEl.textContent = key.hold || "";
    const tapEl = document.createElement("div");
    tapEl.className = tapClass;
    tapEl.textContent = tap;
    face.appendChild(holdEl);
    face.appendChild(tapEl);
    div.appendChild(face);
    if (key.goto) {
      div.style.cursor = "pointer";
      div.addEventListener("click", () => { current = key.goto; render(); });
    }
    keysEl.appendChild(div);
  });

  document.getElementById("note").textContent = NOTES[current] || "";
  document.getElementById("os-mac").setAttribute("aria-pressed", os === "mac" ? "true" : "false");
  document.getElementById("os-win").setAttribute("aria-pressed", os === "win" ? "true" : "false");
  const chip = document.getElementById("layer-chip");
  if (chip) chip.textContent = layerLabel(current);
}

document.getElementById("os-mac").addEventListener("click", () => { os = "mac"; render(); });
document.getElementById("os-win").addEventListener("click", () => { os = "win"; render(); });
render();

window.setBobTailKeymap = function(data) {
  if (!data || !Array.isArray(data.layers)) {
    window.__bobtailLive = null;
    render();
    return;
  }
  window.__bobtailLive = data;
  const next = [];
  for (const layer of data.layers) {
    if (layer && layer.id && layer.id !== "scroll") {
      next.push({ id: layer.id, name: layer.name || layer.id });
    }
  }
  if (next.length) {
    LAYERS.splice(0, LAYERS.length, ...next);
  }
  if (!LAYERS.some((item) => item.id === current) && LAYERS[0]) {
    current = LAYERS[0].id;
  }
  render();
};

function liveKeys(id) {
  const data = window.__bobtailLive;
  if (!data || !Array.isArray(data.layers)) return null;
  const want = id === "scroll" ? "mouse" : id;
  const layer = data.layers.find((item) => item.id === want);
  if (!layer) return null;
  const pack = os === "win" && Array.isArray(layer.win) && layer.win.length ? layer.win : layer.mac;
  return Array.isArray(pack) ? pack : null;
}

window.setBobTailAppearance = function(mode) {
  applyAppearance(mode);
  render();
};

window.setBobTailPressed = function(ids) {
  pressed = Array.isArray(ids) ? ids.map(Number) : [];
  document.querySelectorAll(".key").forEach((el) => {
    el.classList.toggle("pressed", pressed.includes(Number(el.dataset.i)));
  });
};

window.setBobTailState = function(layer, osName, pressedIds) {
  if (typeof layer === "string" && (LAYERS.some((item) => item.id === layer) || layer === "scroll")) {
    current = layer;
  }
  if (osName === "win" || osName === "Windows") os = "win";
  if (osName === "mac" || osName === "macOS") os = "mac";
  if (pressedIds !== undefined) {
    pressed = Array.isArray(pressedIds) ? pressedIds.map(Number) : [];
  }
  render();
};
</script>
</body>
</html>
